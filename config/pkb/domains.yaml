# PKB 领域配置 —— 用户「调方向」的主战场（改本文件即调策略，下次 pkb-curate 运行即生效，无需重编/重启）
# 详见 doc/PKB-IMPLEMENTATION.md §4.2 / §4.5

# 全局默认（可被单个领域覆盖）
defaults:
  vault_threshold: 7.0       # final_score >= 此值 → 进 vault（原子化重构）
  archive_threshold: 4.0     # final_score >= 此值且 < vault_threshold → 进 archive；< 此值 → discard
  weights:                   # 长期知识价值加权（和建议为 1.0）
    relevance: 0.35
    depth: 0.25
    actionability: 0.25
    durability: 0.15
    novelty: 0.0
  score_model: pool-summary    # 打分用快模型组（deepseek/qwen，便宜快，适合批量打分）
  reconstruct_model: pool-pkb  # 重构用 kimi-k2.6（moonshot，推理强；仅 >=7 高分文章触发，量少）
  digest_model: pool-pkb       # 体系化综述用强模型，低频触发
  score_temperature: 0.2           # 快模型允许低温，求稳定 JSON
  reconstruct_temperature: 1.0     # kimi-k2.6 是推理模型，仅接受 temperature=1
  digest_temperature: 1.0          # 与 pool-pkb 默认模型兼容
  per_run: 5                       # 单轮处理量上限（护栏，可被 --per-run 覆盖）
  content_truncate: 8000           # 喂给 LLM 的正文截断长度（rune 字符）
  llm_token_env: PKB_LLM_TOKEN     # 可选：配置专用 LLM Token 后，PKB 可独立限额/计费；未设置则回退 server.api_key
  budget:
    max_score_calls_per_run: 50
    max_reconstruct_calls_per_run: 5
    max_digest_calls_per_run: 3
  retry:
    max_attempts: 4                  # 含首次调用；免费池低速时先少量退避重试
    initial_backoff_seconds: 20      # 429/503 后首次等待
    max_backoff_seconds: 300         # 单次等待上限，避免进程无限挂死
    stop_run_on_rate_limit: true     # 仍被限流时停止本轮，未处理 raw 留到下轮继续

# 领域清单：新增领域=加一个 - name 块；改关键词/阈值只动对应块
domains:
  - name: programming
    display: 编程
    vault_subpath: vault/编程
    keywords: [java, .net, csharp, golang, go, rust, 前端, react, vue, typescript, 后端, 架构, 微服务]

  - name: security
    display: 网络安全
    vault_subpath: vault/安全
    keywords: [渗透测试, 代码审计, 逆向, 安卓, android, 内网渗透, 域渗透, 安全合规, owasp, cve, poc, exp, 漏洞]

  - name: cs-fundamentals
    display: 计算机基础
    vault_subpath: vault/基础
    keywords: [算法, 数据结构, 操作系统, 网络协议, tcp, http, 运维, linux, 容器, k8s, 数据库]

  - name: ai
    display: 人工智能
    vault_subpath: vault/AI
    keywords: [大模型, llm, nlp, 机器学习, 深度学习, 强化学习, rag, agent, transformer, 微调, embedding]

  - name: misc
    display: 周边杂项
    vault_subpath: vault/杂项
    keywords: []                   # 兜底领域（无关键词），matched_domains 都不匹配时归此
    is_default: true

  - name: news
    display: 最新资讯
    vault_subpath: vault/资讯
    keywords: [发布, release, 新版本, 趋势, 动态, 快讯]
    vault_threshold: 8.0           # 资讯门槛更高（时效性内容少进 vault）
