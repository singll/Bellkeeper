# PKB 领域配置 —— 用户「调方向」的主战场（改本文件即调策略，下次 pkb-curate 运行即生效，无需重编/重启）
# 详见 doc/PKB-IMPLEMENTATION.md §4.2 / §4.5

# 全局默认（可被单个领域覆盖）
defaults:
  vault_threshold: 7.0       # final_score >= 此值 → 进 vault（原子化重构）
  archive_threshold: 4.0     # final_score >= 此值且 < vault_threshold → 进 archive；< 此值 → discard
  weights:                   # 长期知识价值加权（和建议为 1.0）；2026-07 重构：长期库重耐久，durability 0.10→0.18，
    relevance: 0.28          #   relevance 略降(0.30→0.28，有相关度硬门兜底离题)，novelty/depth/action 相应下调，和仍=1.0
    depth: 0.24
    actionability: 0.16
    durability: 0.18
    novelty: 0.14
  # 打分门控（结构性改造 2026-07：不漏有用、不进噪音）——改这里即调策略，下轮运行生效，无需重编：
  relevance_gate: 5.0            # relevance < 此值 → 封顶不进 vault（堵「离题但高深度」噪音，如离群科普）；设负数关闭
  relevance_hard_floor: 3.0      # relevance < 此值 → 直接 discard（与配置领域基本无关）；设负数关闭
  atomic_potential_bonus: 0.3    # atomic_potential 达标时 final 上浮（防信息密集好文因单项分不突出被误杀=漏召）
  atomic_potential_bonus_min: 8  # 触发上浮所需 atomic_potential（≈5+ 个可独立知识点）；设 >10 关闭
  content_type_adjust:           # content_type→final 加减分（可只写要改的项，其余用内置默认）；营销/资讯降权、教程/论文/代码提权
    marketing: -2.0
    news: -1.0
    release: -0.5
    tutorial: 0.5
    paper: 0.5
    reference: 0.5
    code: 0.7
    poc: 0.7
  review_ledger_enabled: true    # 拒收台账：被拒/降级条目连同评分写入 vault/_拒收台账/<月>.md，供定期审阈值/查漏召
  snapshot_keep: 5               # digest/ 每域滚动保留份数（增量快照，历史瘦身）
  snapshot_weekly: true          # 同周 digest 快照覆盖为一份（堵一天多份全树冗余）
  score_model: pool-summary    # 打分用快模型组（deepseek/qwen，便宜快，适合批量打分）
  reconstruct_model: pool-pkb  # 重构用 kimi-k2.6（moonshot，推理强；仅 >=7 高分文章触发，量少）
  digest_model: pool-pkb       # 体系化综述用强模型，低频触发
  skeleton_model: pool-pkb     # 骨架生成用顶级推理档（画整棵目标概念树，高价值低频）；空则回退 digest_model
  match_model: pool-summary    # 归位匹配用快强档（卡↔骨架节点判断，高频）；空则回退 score_model
  gapfill_model: pool-pkb      # 缺口填充起草用顶级推理档（写正经原子卡）；空则回退 skeleton_model
  verify_model: pool-summary   # 缺口填充 V2 核实用快强档（页面是否支撑卡片，高频判断）；空则回退 match_model
  promote_model: pool-summary  # 资讯综述/晋升判定用快强档（「今天发生了什么」+ 耐久知识点识别）；空则回退 match_model
  score_temperature: 0.2           # 快模型允许低温，求稳定 JSON
  reconstruct_temperature: 1.0     # kimi-k2.6 是推理模型，仅接受 temperature=1
  digest_temperature: 1.0          # 与 pool-pkb 默认模型兼容
  per_run: 5                       # 单轮处理量上限（护栏，可被 --per-run 覆盖）
  content_truncate: 12000          # 喂给 LLM 的正文截断长度（rune 字符）
  max_cards_per_article: 5         # 单篇文章最多产出几张原子卡片
  enable_semantic_dedup: true      # 是否启用语义去重（SearchContent 步骤）
  map_snapshot_on_refresh: true    # refresh 模式下是否在刷新前保存快照
  topic_moc_enabled: true          # 是否生成主题 MOC（topics/<主题>.md 中间层）
  topic_min_cards: 5               # 一个主题至少含几张卡才单独生成主题 MOC
  skeleton_change_approval_threshold: 5  # 骨架变更影响半径≤此值=小动作快照后自动应用；>此值=大动作走 Matrix !pkb approve 批准
  propose_max_per_round: 40       # 单轮涌现回流 propose 喂入的待归位卡上限；超额按概念排序取前N、其余下轮，防一次喂满上下文致提议质量差
  # 缺口填充（pkb-curate fill）配额与开关 —— 全配置驱动，改本文件即调方向，无需重编/重启：
  gap_fill_per_run: 10           # 每领域每轮最多填几个缺口
  gap_fill_order: breadth        # 自顶向下广度优先：先填根/主题层缺口
  gap_fill_enabled_all: false    # 一键总开关（true=所有配了 scope 的领域都参与填充）
  gap_fill_default: false        # 未在 gap_fill_enabled 显式列出的领域默认开/关
  gap_fill_enabled:              # 每领域开关（优先级最高）—— 打样先只开 programming（C# 落点在编程域 scope）
    programming: true
  # 资讯库（pkb-curate feed）—— ADR-0005 §5：当日资讯类文章分领域分日存档，不进知识骨架/不存独立卡：
  feed_content_types: [news, release]  # 哪些 content_type(pkb_type) 视为「资讯」纳入资讯库综述
  promote_enabled: true                # 晋升闸总开关：耐久知识点(原理/方法/模式,非事件)晋升为知识库卡(复用缺口填充同一 V2 核实)
  promote_durability_min: 7.0          # 晋升所需最低 durability；事件性资讯一律不晋升、留资讯库自然过期
  audit_on_run: true               # 每轮 pkb-curate 结束附带网健康度摘要
  llm_token_env: PKB_LLM_TOKEN     # 可选：配置专用 LLM Token 后，PKB 可独立限额/计费；未设置则回退 server.api_key
  budget:
    max_score_calls_per_run: 50
    max_reconstruct_calls_per_run: 5
    max_digest_calls_per_run: 3
  retry:
    max_attempts: 4                  # 含首次调用；免费池低速时先少量退避重试
    initial_backoff_seconds: 20      # 429/503 后首次等待
    max_backoff_seconds: 300         # 单次等待上限，避免进程无限挂死
    stop_run_on_rate_limit: true     # 仍被限流时停止本轮，未处理 raw 留到下轮继续

# 领域清单：新增领域=加一个 - name 块；改关键词/阈值只动对应块
# scope（大方向）：仅用于 `pkb-curate skeleton <领域>` 生成知识骨架；改一句话即调整目标结构。
#   兜底领域(misc)与资讯流(news)不配 scope，不生成骨架。
domains:
  - name: programming
    display: 编程
    scope: 后端与全栈工程实践——主流语言（Java/C#/.NET/Go/Rust）、前端框架（React/Vue/TypeScript）、服务端架构与微服务的设计与落地。
    vault_subpath: vault/编程
    feed_section: 编程          # 资讯合并「一天一文件」时的小节名（## 编程）
    keywords: [java, .net, csharp, golang, go, rust, 前端, react, vue, typescript, 后端, 架构, 微服务]

  - name: security
    display: 网络安全
    scope: 攻防安全——Web/二进制/移动端漏洞挖掘与利用、代码审计、内网与域渗透、逆向工程，以及对应的防御与合规。
    vault_subpath: vault/安全
    feed_section: 安全          # 资讯合并小节名（## 安全）
    keywords: [渗透测试, 代码审计, 逆向, 安卓, android, 内网渗透, 域渗透, 安全合规, owasp, cve, poc, exp, 漏洞]

  - name: cs-fundamentals
    display: 计算机基础
    scope: 计算机基础与系统——算法与数据结构、操作系统、网络协议（TCP/HTTP）、数据库，以及 Linux 运维与容器/K8s 编排。
    vault_subpath: vault/基础
    feed_section: 基础          # 资讯合并小节名（## 基础）
    keywords: [算法, 数据结构, 操作系统, 网络协议, tcp, http, 运维, linux, 容器, k8s, 数据库]

  - name: ai
    display: 人工智能
    scope: 人工智能工程——大模型原理与微调、RAG/Agent 应用、机器学习与深度学习基础、NLP 与 Transformer 架构。
    vault_subpath: vault/AI
    feed_section: AI            # 资讯合并小节名（## AI）
    keywords: [大模型, llm, nlp, 机器学习, 深度学习, 强化学习, rag, agent, transformer, 微调, embedding]

  - name: misc
    display: 周边杂项
    vault_subpath: vault/杂项
    keywords: []                   # 兜底领域（无关键词），matched_domains 都不匹配时归此
    is_default: true

  - name: news
    display: 最新资讯
    vault_subpath: vault/资讯
    keywords: [发布, release, 新版本, 趋势, 动态, 快讯]
    vault_threshold: 8.0           # 资讯门槛更高（时效性内容少进 vault）
    feed: true                     # 资讯库容器（ADR-0005）：vault/资讯 承载分领域分日资讯存档(资讯/<领域>/<日期>.md)，
                                   # 不产知识原子卡——digest/audit 跳过本领域、知识卡统计不计入，资讯不进知识骨架。
