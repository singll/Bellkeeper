server:
  host: 0.0.0.0
  port: 8080
  mode: noauth  # debug, release, noauth (noauth 关闭 /api 认证，仅限内网/VPN 可信网络)
  api_key: ${BELLKEEPER_SERVER_API_KEY}
  # shutdown_timeout: 10  # 优雅关机超时（秒）

database:
  driver: postgres
  host: ${BELLKEEPER_DATABASE_HOST}
  port: 5432
  name: ${BELLKEEPER_DATABASE_NAME}
  user: ${BELLKEEPER_DATABASE_USER}
  password: ${BELLKEEPER_DATABASE_PASSWORD}
  sslmode: disable
  # max_idle_conns: 10      # 连接池最大空闲连接
  # max_open_conns: 100     # 连接池最大打开连接
  # conn_max_lifetime: 60   # 连接最大生命周期（分钟）

n8n:
  webhook_base_url: ${BELLKEEPER_N8N_WEBHOOK_BASE_URL}
  api_base_url: ${BELLKEEPER_N8N_API_BASE_URL}
  api_key: ${BELLKEEPER_N8N_API_KEY}
  # timeout: 30  # HTTP 客户端超时（秒）

logging:
  level: info
  format: json
  output: stdout

features:
  auto_parse: true
  url_dedup: true

classify:
  enabled: true
  llm_proxy_url: "http://localhost:8080/api/llm/v1"
  model: "Qwen/Qwen3-8B"
  temperature: 0.3
  max_content_len: 1000
  timeout: 10
  # prompt: ""  # 留空使用内置默认提示词，可自定义 LLM 分类提示词

llm_job_queue:
  enabled: true
  workers: 1                    # 免费模型池吞吐低，默认单 worker 慢慢排
  poll_interval_seconds: 5
  max_retries: 24               # 持久队列重试次数，支持长时间慢跑
  initial_backoff_seconds: 30
  max_backoff_seconds: 900
  stale_timeout_minutes: 30     # server 重启/崩溃后回收 running 任务
  recovery_interval_minutes: 5
  job_timeout_seconds: 600

llm_proxy:
  enabled: true
  default_timeout: 60
  max_retries: 3
  # max_wait_seconds: 30       # 令牌桶等待上限（秒）
  # backoff_cap_seconds: 60    # 指数退避上限（秒）
  # backoff_jitter: 0.5        # 退避抖动因子
  # default_bucket_rpm: 1000   # 无 RPM 配置时的兜底值

  # 熔断器配置
  circuit_breaker:
    failure_threshold: 5       # 连续失败 N 次后熔断
    cooldown_seconds: 120      # 熔断冷却时间（秒）
    half_open_max: 1           # 半开状态最多放行请求数
    error_window_seconds: 300  # 错误统计滑动窗口（秒）

  # 虚拟模型组
  model_groups:
    - name: "pool-chat-free"
      description: "免费 Chat 模型池（分类/解析增强）"
      strategy: "priority-health"
      sticky_ttl_seconds: 600
      members:
        - channel: "siliconflow-qwen3-8b"
          model: "Qwen/Qwen3-8B"
          weight: 3
        - channel: "siliconflow-qwen25-7b"
          model: "Qwen/Qwen2.5-7B-Instruct"
          weight: 2
        - channel: "glm-flash-via-newapi"
          model: "GLM-4.7-Flash"
          weight: 1

    - name: "pool-chat-balanced"
      description: "均衡 Chat 模型池（QA 问答，付费主力 + 免费兜底）"
      strategy: "priority-health"
      sticky_ttl_seconds: 300
      members:
        - channel: "qwen-plus-direct"
          model: "qwen3.5-plus"
          weight: 5
        - channel: "siliconflow-qwen3-8b"
          model: "Qwen/Qwen3-8B"
          weight: 1
        - channel: "glm-flash-via-newapi"
          model: "GLM-4.7-Flash"
          weight: 1

    - name: "pool-summary"
      description: "AI 总结池（DeepSeek 主力 + Qwen 备用）"
      strategy: "priority-health"
      sticky_ttl_seconds: 900
      members:
        - channel: "deepseek-direct"
          model: "deepseek-chat"
          weight: 5
        - channel: "qwen-plus-direct"
          model: "qwen3.5-plus"
          weight: 2

    - name: "pool-pkb"
      description: "PKB 知识卡片池（Kimi K2.6 主力，长上下文 + 高质量中文输出）"
      strategy: "priority-health"
      sticky_ttl_seconds: 900
      members:
        - channel: "kimi-direct"
          model: "kimi-k2.6"
          weight: 5
        - channel: "deepseek-direct"
          model: "deepseek-chat"
          weight: 2

  channels:
    - name: siliconflow-qwen3-8b
      base_url: https://api.siliconflow.cn
      api_key: ${LLM_SILICONFLOW_API_KEY}
      rpm: 500
      rpd: 50000
      priority: 1
      is_free: true
      models:
        - Qwen/Qwen3-8B
      is_enabled: true
    - name: siliconflow-qwen25-7b
      base_url: https://api.siliconflow.cn
      api_key: ${LLM_SILICONFLOW_API_KEY}
      rpm: 500
      rpd: 50000
      priority: 1
      is_free: true
      models:
        - Qwen/Qwen2.5-7B-Instruct
      is_enabled: true
    - name: qwen-plus-direct
      base_url: https://dashscope.aliyuncs.com/compatible-mode
      api_key: ${LLM_QWEN_API_KEY}
      rpm: 500
      rpd: 20000
      priority: 1
      models:
        - qwen3.5-plus
        - qwen-plus
      is_enabled: true
    - name: qwen-flash-direct
      base_url: https://dashscope.aliyuncs.com/compatible-mode
      api_key: ${LLM_QWEN_API_KEY}
      rpm: 1000
      rpd: 50000
      priority: 1
      models:
        - qwen3.5-flash
        - qwen-turbo
      is_enabled: true
    - name: deepseek-direct
      base_url: https://api.deepseek.com
      api_key: ${LLM_DEEPSEEK_API_KEY}
      rpm: 10
      rpd: 500
      priority: 1
      models:
        - deepseek-chat
      is_enabled: true
    - name: glm-flash-via-newapi
      base_url: ${LLM_NEWAPI_BASE_URL}
      api_key: ${LLM_NEWAPI_API_KEY}
      rpm: 30
      rpd: 1500
      priority: 2
      is_free: true
      models:
        - glm-4-flash
        - GLM-4.7-Flash
      is_enabled: true
    - name: kimi-direct
      base_url: https://api.moonshot.cn
      api_key: ${LLM_KIMI_API_KEY}
      rpm: 3
      rpd: 50
      priority: 3
      models:
        - moonshot-v1-128k
        - kimi-k2.6
      is_enabled: true

file_ingestion:
  enabled: true
  base_path: "/mnt/knowledge"
  raw_dir: "raw"
  working_dir: "working"
  default_layer: "raw"

  trafilatura:
    enabled: true
    timeout: 30        # 增加到 30s，给本地提取更多时间
    min_content_length: 100

  firecrawl:
    enabled: true
    api_url: "${FIRECRAWL_API_URL}"
    timeout: 120       # 增加到 120s，API 提取更可靠但更慢
    fallback_only: false  # 显式关闭 fallback-only，保留备用

matrix:
  homeserver_url: ${MATRIX_HOMESERVER_URL}
  bot_user_id: ${MATRIX_BOT_USER_ID}
  bot_access_token: ${MATRIX_BOT_ACCESS_TOKEN}
  device_id: ${MATRIX_BOT_DEVICE_ID}
  sync_timeout: ${MATRIX_SYNC_TIMEOUT}
  command_prefix: ${MATRIX_COMMAND_PREFIX}
  max_retry: ${MATRIX_MAX_RETRY}
  admin_users:
    - ${MATRIX_ADMIN_USER}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  db: ${REDIS_DB}
  password: ${REDIS_PASSWORD}

nats:
  url: ${NATS_URL}
  streams:
    notifications: ${NATS_STREAM_NOTIFICATIONS}
    commands: ${NATS_STREAM_COMMANDS}

# Meilisearch 搜索服务
meilisearch:
  url: http://sp-meilisearch:7700
  api_key: ${MEILI_MASTER_KEY}
  index: knowledge_chunks

# RSS 抓取器配置
rss_fetcher:
  enabled: true
  rsshub_base_url: "http://sp-rsshub:1200"  # RSSHub 实例地址，以 / 开头的 feed URL 会拼接此地址

# 知识库配置
knowledge:
  enabled: true
  base_path: /mnt/knowledge
  # 三层知识库：raw 绝不进 Meili；archive(中等价值)/vault(高价值卡片) 进 Meili。
  # working/ 不在此列——它是 ReportService 的渠道消息存档区，不进知识检索。
  scan_dirs:
    - path: archive
      layer: archive
    - path: vault
      layer: vault
  scan_interval: 300
  chunk_min_size: 100
  chunk_max_size: 600
