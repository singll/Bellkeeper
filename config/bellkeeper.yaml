server:
  host: 0.0.0.0
  port: 8080
  mode: release  # debug, release
  api_key: ${BELLKEEPER_SERVER_API_KEY}
  # shutdown_timeout: 10  # 优雅关机超时（秒）

database:
  driver: postgres
  host: ${BELLKEEPER_DATABASE_HOST}
  port: 5432
  name: ${BELLKEEPER_DATABASE_NAME}
  user: ${BELLKEEPER_DATABASE_USER}
  password: ${BELLKEEPER_DATABASE_PASSWORD}
  sslmode: disable
  # max_idle_conns: 10      # 连接池最大空闲连接
  # max_open_conns: 100     # 连接池最大打开连接
  # conn_max_lifetime: 60   # 连接最大生命周期（分钟）

ragflow:
  base_url: ${BELLKEEPER_RAGFLOW_BASE_URL}
  api_key: ${BELLKEEPER_RAGFLOW_API_KEY}
  timeout: 30

n8n:
  webhook_base_url: ${BELLKEEPER_N8N_WEBHOOK_BASE_URL}
  api_base_url: ${BELLKEEPER_N8N_API_BASE_URL}
  api_key: ${BELLKEEPER_N8N_API_KEY}
  # timeout: 30  # HTTP 客户端超时（秒）

logging:
  level: info
  format: json
  output: stdout

features:
  auto_parse: true
  url_dedup: true
  ai_summary: false

classify:
  enabled: true
  llm_proxy_url: "http://localhost:8080/api/llm/v1"
  model: "qwen3.5-flash"
  temperature: 0.3
  max_content_len: 1000
  timeout: 10
  # prompt: ""  # 留空使用内置默认提示词，可自定义 LLM 分类提示词

llm_proxy:
  enabled: true
  default_timeout: 60
  max_retries: 3
  # max_wait_seconds: 30       # 令牌桶等待上限（秒）
  # backoff_cap_seconds: 60    # 指数退避上限（秒）
  # backoff_jitter: 0.5        # 退避抖动因子
  # default_bucket_rpm: 1000   # 无 RPM 配置时的兜底值
  channels:
    - name: qwen-plus-direct
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${LLM_QWEN_API_KEY}
      rpm: 500
      rpd: 20000
      priority: 1
      models:
        - qwen3.5-plus
        - qwen-plus
      is_enabled: true
    - name: qwen-flash-direct
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${LLM_QWEN_API_KEY}
      rpm: 1000
      rpd: 50000
      priority: 1
      models:
        - qwen3.5-flash
        - qwen-turbo
      is_enabled: true
    - name: deepseek-direct
      base_url: https://api.deepseek.com
      api_key: ${LLM_DEEPSEEK_API_KEY}
      rpm: 10
      rpd: 500
      priority: 1
      models:
        - deepseek-chat
      is_enabled: true
    - name: glm-flash-via-newapi
      base_url: ${LLM_NEWAPI_BASE_URL}
      api_key: ${LLM_NEWAPI_API_KEY}
      rpm: 30
      rpd: 1500
      priority: 2
      models:
        - glm-4-flash
        - GLM-4.7-Flash
      is_enabled: true
    - name: kimi-direct
      base_url: https://api.moonshot.cn
      api_key: ${LLM_KIMI_API_KEY}
      rpm: 3
      rpd: 50
      priority: 3
      models:
        - moonshot-v1-128k
      is_enabled: true
